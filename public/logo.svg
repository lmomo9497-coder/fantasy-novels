<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
<title id="title">روايات خيالية</title>
<desc id="desc">قطة جالسة من الخلف فوق كتاب مفتوح، بأسلوب بنفسجي وردي، مع ذيل طويل منحني واسم روايات خيالية أسفلها.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#7936d1"/>
    <stop offset=".5" stop-color="#bd4fdb"/>
    <stop offset="1" stop-color="#fa82bd"/>
  </linearGradient>
</defs>


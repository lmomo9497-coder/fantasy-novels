<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
<title id="title">روايات خيالية</title>
<desc id="desc">قطة بنفسجية وردية جالسة فوق كتاب مفتوح مع ذيل منسدل حول الكتاب واسم روايات خيالية أسفله.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#7d3fd0"/>
    <stop offset=".5" stop-color="#bd50d8"/>
    <stop offset="1" stop-color="#f487bd"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#8b45d5"/>
    <stop offset="1" stop-color="#f28abd"/>
  </linearGradient>
</defs>

<!-- قطة جالسة من الخلف -->
<path d="M349 116

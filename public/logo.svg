    <stop offset="1" stop-color="#f08ab9"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#30203e"/>
    <stop offset=".55" stop-color="#17131d"/>
    <stop offset="1" stop-color="#40223f"/>
  </linearGradient>
</defs>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" role="img" aria-labelledby="title desc">
<title id="title">روايات خيالية</title>
<desc id="desc">قطة جالسة من الخلف فوق كتاب مفتوح، وذيل طويل ينساب تحت اسم روايات خيالية.</desc>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#a96bd0"/>
    <stop offset=".55" stop-color="#d47acb"/>
    <stop offset="1" stop-color="#f19abf"/>
  </linearGradient>
</defs>

<!-- الكتابة فوق الذيل -->
<text x="286" y="78" direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
  font-family="Noto Sans Arabic,Noto Naskh Arabic,Amiri,sans-serif"
  font-size="58" font-weight="800" fill="url(#ink)">روايات خيالية</text>

<!-- الذيل: خط واحد طويل وناعم أسفل الكتابة، خارج من القطة -->
<path d="M554 128
         C526 133 505 133 485 128

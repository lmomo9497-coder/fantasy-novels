  <!-- لمسات ظهر بسيطة -->
  <path d="M404 102 C414 110 425 114 435 114 C446 114 457 110 467 102"
        stroke-width="2.5" opacity=".65"/>
  <path d="M409 121 C417 130 423 139 427 151

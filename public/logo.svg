  fill="none" stroke="url(#ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

<!-- القطة والكتاب -->
<g stroke="url(#ink)" fill="none" stroke-linecap="round" stroke-linejoin="round">

<!-- الاسم -->
<text x="402" y="92" text-anchor="middle"
 direction="rtl" unicode-bidi="plaintext"
 font-family="Noto Sans Arabic,Noto Naskh Arabic,Amiri,sans-serif"
 font-size="57" font-weight="850" fill="url(#g)">روايات خيالية</text>

<!-- سطر زخرفي صغير تحت الاسم -->
<path d="M250 112 C315 99 365 105 414 112 C465 119 515 116 552 105"

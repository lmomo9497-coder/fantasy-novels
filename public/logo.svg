<path d="M402 177V222" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"/>

<!-- صفحات الكتاب -->
<path d="M250 183 C294 174 338 176 381 188
 M246 196 C290 187 334 189 377 201
 M427 188 C470 176 514 174 554 183
 M427 201 C470 189 514 187 558 196"

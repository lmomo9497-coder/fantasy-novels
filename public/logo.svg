<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" role="img" aria-labelledby="title desc">
<title id="title">روايات خيالية</title>
<desc id="desc">قطة جالسة فوق كتاب مفتوح، وذيلها الطويل يتحول إلى سطر أنيق أسفل اسم روايات خيالية.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#9b5bd0"/>
    <stop offset=".5" stop-color="#c56bd2"/>
    <stop offset="1" stop-color="#f08ab9"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#30203e"/>
    <stop offset=".55" stop-color="#17131d"/>
    <stop offset="1" stop-color="#40223f"/>
  </linearGradient>
</defs>

<!-- القطة + الكتاب -->
<g stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
  <!-- الكتاب المفتوح -->
  <path d="M410 151
           C369 137 327 136 283 148
           L264 187
           C315 174 364 176 410 194 Z"
        fill="#17131d" stroke-width="5"/>
  <path d="M410 194
           C456 176 505 174 556 187
           L537 148
           C493 136 451 137 410 151 Z"
        fill="#17131d" stroke-width="5"/>
  <path d="M410 151V194" fill="none" stroke-width="4"/>
  <path d="M292 156 C323 151 351 153 382 161
           M528 156 C497 151 469 153 438 161"
        fill="none" stroke-width="2.4" opacity=".55"/>

  <!-- الذيل الطويل: يبدأ من القطة ثم يصبح سطر دفتر تحت الاسم -->
  <path d="M448 119
           C484 116 505 99 504 82
           C503 65 487 55 472 62
           C456 70 456 89 470 97
           C482 104 498 100 506 91
           C515 81 515 67 508 57
           M448 119
           C417 126 384 128 348 128
           C297 128 247 122 197 120
           C151 118 111 121 78 129
           C55 134 35 142 18 151"
        fill="none" stroke-width="7"/>

  <!-- القطة الجالسة: شكل بسيط ونظيف من الخلف -->
  <path d="M382 107
           C369 96 362 81 364 65
           C366 48 376 35 391 29
           L384 8
           L407 26
           C419 22 432 22 444 26
           L468 8
           L461 29
           C477 36 488 49 490 65
           C492 82 485 97 472 107
           C459 118 446 123 427 123
           C408 123 395 118 382 107 Z"
        fill="url(#body)" stroke-width="4"/>

  <!-- الجسم الجالس -->
  <path d="M382 103
           C365 115 359 132 363 148
           C367 164 380 173 397 173
           C410 173 421 168 427 158
           C434 168 446 173 459 173
           C476 173 489 164 493 148
           C497 132 490 115 472 103
           C459 95 444 92 427 93
           C411 92 396 95 382 103 Z"
        fill="url(#body)" stroke-width="4"/>

  <!-- الأرجل الأمامية والقدمين -->
  <path d="M397 114 C398 131 401 144 406 155
           M457 114 C456 131 453 144 448 155"
        fill="none" stroke-width="3" opacity=".8"/>
  <path d="M372 169
           C383 163 398 164 407 171
           C414 176 411 182 404 184
           C389 186 377 181 372 176 Z"
        fill="#201827" stroke-width="3"/>
  <path d="M447 171
           C456 164 471 163 482 169
           L482 176
           C477 181 464 186 449 184
           C442 182 440 176 447 171 Z"
        fill="#201827" stroke-width="3"/>

  <!-- لمسة ظهر واحدة فقط -->
  <path d="M395 100 C406 108 417 112 427 112
           C439 112 450 108 460 100"
        fill="none" stroke-width="2.6" opacity=".6"/>
</g>

<!-- اسم الموقع: واضح ومكتوب فوق سطر الذيل -->
<text x="286" y="93"
      direction="rtl" unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Noto Sans Arabic,Noto Naskh Arabic,Amiri,sans-serif"
      font-size="58" font-weight="850"
      fill="url(#accent)">روايات خيالية</text>
</svg>